services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    restart: always
    depends_on:
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  neo4j:
    container_name: neo4j 
    image: neo4j:2026.06.0
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NEO4J_AUTH: "neo4j/${DRIVER_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${DRIVER_PASSWORD}\" 'RETURN 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    container_name: worker 
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: dramatiq app.tasks
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    container_name: rabbitmq 
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  ollama:
    container_name: ollama 
    image: ollama/ollama:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      pid=$$!;
      until ollama list >/dev/null 2>&1; do sleep 1; done;
      echo $$OLLAMA_EMBEDDING_MODEL;
      ollama pull $$OLLAMA_EMBEDDING_MODEL;
      wait $$pid"

  minio:
    container_name: minio 
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    container_name: minio-init
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env.docker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for MinIO..."

        until mc alias set minio \
          http://minio:9000 \
          "$$MINIO_ROOT_USER" \
          "$$MINIO_ROOT_PASSWORD"; do
          echo "MinIO is not ready yet..."
          sleep 2
        done

        echo "MinIO is ready."

        mc mb --ignore-existing "minio/$$MINIO_BUCKET"

        echo "MinIO initialization complete."

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  minio_data:
  postgres_data: