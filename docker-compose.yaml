version: "3.8"
services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    restart: always
    depends_on:
      - ollama
      - neo4j
      - rabbitmq
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  neo4j:
    image: neo4j:2026.06.0
    restart: unless-stopped

    environment:
      NEO4J_AUTH: "neo4j/${DRIVER_PASSWORD}"

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: dramatiq app.tasks
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      pid=$$!;
      until ollama list >/dev/null 2>&1; do sleep 1; done;
      echo $OLLAMA_MODEL_NAME;
      ollama pull $OLLAMA_MODEL_NAME;
      wait $$pid"

  services:
    app:
      build: .
      env_file:
        - .env
      depends_on:
        - minio

    minio:
      image: minio/minio
      command: server /data --console-address ":9001"
      env_file:
        - .env
      ports:
        - "9000:9000"
        - "9001:9001"
      volumes:
        - minio_data:/data

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  minio_data: